# MacAni Aldo terminal defaults. Transparency requires a compositing window manager.
font_family JetBrains Mono
font_size 11.0
bold_font auto
italic_font auto
shell /usr/bin/fish --login

background #0B1020
foreground #EAF3FF
background_opacity 0.92
selection_background #1A4164
selection_foreground #FFFFFF
cursor #71E6FF
cursor_text_color #07111D

color0  #0B1020
color1  #FF6B9D
color2  #42E0C1
color3  #FFD479
color4  #438DFF
color5  #AB73FF
color6  #28D8E8
color7  #DCE8FF
color8  #5C6680
color9  #FF8DB2
color10 #69F0D4
color11 #FFE39D
color12 #72AEFF
color13 #C69BFF
color14 #5AE9F2
color15 #FFFFFF

scrollback_lines 8000
enable_audio_bell no
allow_remote_control no
listen_on none
