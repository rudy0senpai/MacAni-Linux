# MacAni Linux — SDDM 0.21.0 greeter theme configuration.
#
# This file is read by sddm-greeter from the theme directory:
#   /usr/share/sddm/themes/macani/theme.conf
#
# The [General] section carries theme-specific settings. Keys are passed to
# the greeter via the `config` QML object, so they may be consulted from
# Main.qml via `config.<key>`.
#
# Paths are relative to this file's directory. For example:
#   Background=logo.png
#
# The greeter background rendered from `background=` is drawn behind the QML
# scene. This theme instead paints its own liquid-glass gradient in QML and
# uses logo.png merely as a decorative asset referenced by the config key so
# the theme stays self-describing.

[General]
Background=logo.png
